name: anode
description: A GPS speedometer that simulates a 1980s vacuum fluorescent display.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/vfd.frag
